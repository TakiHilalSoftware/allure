name: E2E Tests + Allure Report

on:
  repository_dispatch:
    types: [app-deployed]
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to test'
        required: true
        default: 'https://allure-playground.vercel.app'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        run: |
          URL="${{ github.event.client_payload.url }}"
          if [ -z "$URL" ]; then
            URL="${{ inputs.url }}"
          fi
          if [ -z "$URL" ]; then
            echo "No URL provided"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Testing against: $URL"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in $(seq 1 30); do
            echo "Check $i/30..."
            if curl -sf "$URL" > /dev/null; then
              echo "Ready!"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out"
          exit 1

      - name: Run Playwright tests
        run: npm test
        env:
          BASE_URL: ${{ steps.url.outputs.url }}

      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Checkout gh-pages
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Publish to GitHub Pages
        if: always()
        run: |
          mkdir -p gh-pages
          cp -r allure-report gh-pages/${{ github.run_number }}
          rm -rf gh-pages/latest
          cp -r allure-report gh-pages/latest

          cd gh-pages
          echo "<html><body><h2>Allure Reports</h2><ul>" > index.html
          for dir in $(ls -d [0-9]*/ 2>/dev/null | sort -rV); do
            echo "<li><a href='${dir}index.html'>Run ${dir%/}</a></li>" >> index.html
          done
          echo "</ul></body></html>" >> index.html

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Allure report for run ${{ github.run_number }}" || echo "Nothing to commit"
          git push origin gh-pages