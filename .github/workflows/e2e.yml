name: E2E Tests + Allure Report

on:
  repository_dispatch:
    types: [app-deployed]
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to test'
        required: true
        default: 'https://allure-playground.vercel.app'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        run: |
          URL="${{ github.event.client_payload.url }}"
          if [ -z "$URL" ]; then
            URL="${{ inputs.url }}"
          fi
          if [ -z "$URL" ]; then
            echo "No URL provided"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Testing against: $URL"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'allure-playwright-tests/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: allure-playwright-tests
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: allure-playwright-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in $(seq 1 30); do
            echo "Check $i/30..."
            if curl -sf "$URL" > /dev/null; then
              echo "Ready!"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out"
          exit 1

      - name: Run Playwright E2E tests
        working-directory: allure-playwright-tests
        run: pnpm test
        env:
          BASE_URL: ${{ steps.url.outputs.url }}

      - name: Setup Java (Temurin 17) for Allure CLI
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure Report
        if: always()
        working-directory: allure-playwright-tests
        run: pnpm exec allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        if: always()
        run: |
          # 1. Initialize local gh-pages workspace cleanly
          mkdir -p gh-pages
          cd gh-pages
          git init
          git checkout -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 2. Try to pull existing gh-pages history if it exists
          git fetch origin gh-pages && git reset --hard origin/gh-pages || echo "Branch gh-pages does not exist yet. Starting fresh."
          cd ..

          # 3. Copy reports to the gh-pages repository
          cp -r allure-playwright-tests/allure-report gh-pages/${{ github.run_number }}
          rm -rf gh-pages/latest
          cp -r allure-playwright-tests/allure-report gh-pages/latest

          # 4. Generate historical directory listing
          cd gh-pages
          echo "<html><body><h2>Allure Reports</h2><ul>" > index.html
          for dir in $(ls -d [0-9]*/ 2>/dev/null | sort -rV); do
            echo "<li><a href='${dir}index.html'>Run ${dir%/}</a></li>" >> index.html
          done
          echo "</ul></body></html>" >> index.html

          # 5. Commit and push back to repository
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Allure report for run ${{ github.run_number }}" || echo "Nothing to commit"
          git push origin gh-pages