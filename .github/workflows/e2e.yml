name: E2E Tests + Allure Report

on:
  repository_dispatch:
    types: [app-deployed]
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to test'
        required: true
        default: 'https://allure-playground.vercel.app'

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: url
        run: |
          URL="${{ github.event.client_payload.url }}"
          if [ -z "$URL" ]; then
            URL="${{ inputs.url }}"
          fi
          if [ -z "$URL" ]; then
            echo "No URL provided"
            exit 1
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Testing against: $URL"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait for deployment to be ready
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in $(seq 1 30); do
            echo "Check $i/30..."
            if curl -sf "$URL" > /dev/null; then
              echo "Ready!"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out"
          exit 1

      - name: Run Playwright E2E tests
        run: pnpm test
        env:
          BASE_URL: ${{ steps.url.outputs.url }}

      - name: Setup Java (Temurin 17) for Allure CLI
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Carry forward Allure history
        if: always()
        run: |
          # Pull history from the previous latest report so Allure can render trends
          mkdir -p gh-pages
          cd gh-pages
          git init
          git checkout -b gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin gh-pages && git reset --hard origin/gh-pages || echo "No previous gh-pages — starting fresh."
          cd ..

          # If a previous history folder exists, inject it into allure-results before generation
          if [ -d "gh-pages/latest/history" ]; then
            echo "Carrying forward history from previous run..."
            mkdir -p allure-results
            cp -r gh-pages/latest/history allure-results/history
          fi

      - name: Generate Allure Report
        if: always()
        run: pnpm exec allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        if: always()
        run: |
          # Copy this run's report into gh-pages/latest (always the canonical URL)
          rm -rf gh-pages/latest
          cp -r allure-report gh-pages/latest

          # Root index.html: instant redirect to /latest/ — no manual link list needed
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=latest/index.html" />
              <title>Allure Report</title>
            </head>
            <body>
              <p>Redirecting to <a href="latest/index.html">latest report</a>…</p>
            </body>
          </html>
          EOF

          # Commit and push
          cd gh-pages
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Allure report — run ${{ github.run_number }}" || echo "Nothing to commit"
          git push origin gh-pages